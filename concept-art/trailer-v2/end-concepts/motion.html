<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sugarfall — final cup catch</title>
<style>
@font-face{font-family:SugarfallFraunces;src:url('../../../PLINKO/data/fonts/Fraunces-Variable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#c9ded0}
#ending{position:relative;width:1080px;height:1920px;overflow:hidden;background:#c9ded0}
.texture{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
.warm-wash{position:absolute;inset:0;background:linear-gradient(180deg,#fff5d847 0%,#fbf9e416 46%,#94b9a744 100%)}
.glow{position:absolute;left:90px;top:930px;width:900px;height:650px;border-radius:50%;background:radial-gradient(ellipse,#fff7d888 0%,#fff8d800 72%)}
.cup{position:absolute;width:670px;height:670px;object-fit:contain;left:205px;top:1125px}
.cup-back{z-index:3;filter:drop-shadow(0 25px 25px #46624d25)}
.cup-front{z-index:6;clip-path:url(#front-cup-mask)}
#doughnut{position:absolute;width:265px;height:265px;object-fit:contain;left:427.5px;top:867.5px;z-index:5;transform:rotate(-18deg);filter:drop-shadow(-7px 12px 12px #51422a15);will-change:left,top,transform}
#wordmark{position:absolute;z-index:8;top:465px;width:100%;left:0;text-align:center;color:#5c3c2b;font-family:SugarfallFraunces,serif;font-size:168px;font-weight:650;font-variation-settings:'wght' 650,'SOFT' 70,'opsz' 36,'WONK' 1;font-optical-sizing:none;letter-spacing:-5px;line-height:1.15;text-shadow:0 3px 0 #fff8e6;white-space:nowrap;opacity:0}
.rim{position:absolute;left:126px;right:126px;bottom:137px;border-top:1px solid #7c9c7b55}
svg.defs{position:absolute;width:0;height:0;overflow:hidden}
</style>
</head>
<body>
<main id="ending" aria-label="A pink doughnut falls into the painted gold collection cup, then the Sugarfall title settles above it">
<img class="texture" src="../../../PLINKO/data/art/food/countertop.png" alt="">
<div class="warm-wash"></div><div class="glow"></div>
<svg class="defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><clipPath id="front-cup-mask" clipPathUnits="objectBoundingBox"><path d="M .08 .19 C .12 .31 .88 .31 .94 .19 L 1 1 L 0 1 Z"/></clipPath></defs></svg>
<img class="cup cup-back" src="../../../PLINKO/data/art/food/cup_gold.png" alt="">
<img id="doughnut" src="../../../PLINKO/data/art/food/donut.png" alt="">
<img class="cup cup-front" src="../../../PLINKO/data/art/food/cup_gold.png" alt="">
<div id="wordmark">Sugarfall</div><div class="rim"></div>
</main>
<script>
const doughnut=document.getElementById('doughnut');
const wordmark=document.getElementById('wordmark');
const clamp=value=>Math.min(1,Math.max(0,value));
const smooth=value=>{const p=clamp(value);return p*p*(3-2*p);};
window.renderEnding=function(seconds){
 const t=Math.min(2.9,Math.max(0,Number(seconds)||0));
 const p=clamp(t/.52);
 let x=540+28*(1-p),y=1000+320*p*p,rotation=-18+8*p;
 if(t>=.52){
  const u=clamp((t-.52)/.25);
  y=1320+7*Math.sin(Math.PI*u)*(1-u);
  rotation=-10+2*smooth(u);
 }
 doughnut.style.left=(x-132.5)+'px';
 doughnut.style.top=(y-132.5)+'px';
 doughnut.style.transform='rotate('+rotation+'deg)';
 wordmark.style.opacity=String(smooth((t-.52)/.26));
 document.documentElement.dataset.time=t.toFixed(6);
 return {time:t,doughnutCenter:[x,y],rotation,titleOpacity:Number(wordmark.style.opacity),cupFrontOcclusion:true};
};
window.endingReady=Promise.all([
 document.fonts.load('650 168px SugarfallFraunces'),
 ...Array.from(document.images).map(image=>image.decode())
]).then(values=>{if(values[0].length!==1||!document.fonts.check('650 168px SugarfallFraunces'))throw Error('Bundled Fraunces did not load');window.renderEnding(0);return true;});
</script>
</body>
</html>
