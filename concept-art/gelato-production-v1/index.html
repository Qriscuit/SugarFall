<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sugarfall · Gelato Garden production art</title>
<style>
@font-face{font-family:Nunito;src:url('../../PLINKO/data/fonts/Nunito-Variable.ttf')}*{box-sizing:border-box}body{margin:0;background:#f7efdf;color:#493a35;font:16px Nunito,system-ui,sans-serif}header,main{max-width:1240px;margin:auto;padding:32px}header{padding-bottom:0}h1{font:600 36px Georgia,serif;margin:0 0 10px}p{color:#76685f;line-height:1.5;margin:0}h2{font:600 25px Georgia,serif;margin:32px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.card{display:block;text-decoration:none;color:inherit;border:1px solid #dacac5;border-radius:18px;padding:16px;background:#fffaf1;overflow:hidden}.card:hover{border-color:#9474ad}.card img{width:100%;height:190px;object-fit:contain;display:block}.card span{display:block;font-size:13px;margin-top:12px;text-align:center}.screens{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.screens .card{padding:8px}.screens img{height:auto;width:100%;border-radius:11px}.small{display:flex;gap:16px;justify-content:center;align-items:center;height:60px;margin-top:12px;border-top:1px solid #e9deda}.small img{width:32px;height:32px;object-fit:contain}.small img+img{width:49px;height:49px}.environment img{height:290px}.status{margin:24px 0;color:#806e88}a{color:#76518b}button{margin-top:20px;border:1px solid #c6b4ca;background:#e6d8ee;color:#4e3c58;padding:10px 16px;border-radius:20px;cursor:pointer}body.dark .card{background:#342c38;color:#f9eadb}footer{padding:20px 0 40px;color:#8a7d73;font-size:13px}
</style>
<header><h1>Gelato Garden</h1><p>Sugarfall · individual production PNGs and in-game captures</p><button onclick="document.body.classList.toggle('dark')">Switch sprite backdrop</button></header>
<main><section id="screens"></section><div id="assets"></div><footer>Original PNG pixels preserved. Damage stages share a single frame per wafer family. Preview thumbnails are browser scaling only.</footer></main>
<script>
const food=['donut','pomegranate','pumpkin','seed','ricochet','cookie_normal','cookie_normal_damage_1','cookie_normal_damage_2','cookie_normal_damage_3','cookie_armored','cookie_armored_damage_1','cookie_armored_damage_2','cookie_armored_damage_3','cookie_prism','cookie_prism_damage_1','cookie_prism_damage_2','cookie_prism_damage_3','cookie_clock','cookie_clock_damage_1','cookie_clock_damage_2','cookie_clock_damage_3','cup_cream','cup_gold','hopper','tray'];
const groups={food,environment:['home_counter','play_counter','upgrade_counter','journey_backdrop','bakery_landmark'],ui:['panel','level_selector','level_badge_muted']};
const labels={food:'Food, wafers and equipment',environment:'Backgrounds and landmark',ui:'Lavender interface pieces'};
for(const [family,names] of Object.entries(groups)){const section=document.createElement('section');section.innerHTML=`<h2>${labels[family]}</h2><div class="grid ${family}"></div>`;for(const name of names){const path=`../../PLINKO/data/art/gelato/${family}/${name}.png`;const a=document.createElement('a');a.className='card';a.href=path;a.target='_blank';a.innerHTML=`<img loading="lazy" src="${path}" alt="${name.replaceAll('_',' ')}"><span>${name.replaceAll('_',' ')}</span>${family==='food'&& !['hopper','tray','cup_cream','cup_gold'].includes(name)?`<div class="small"><img src="${path}" alt="32 pixel preview"><img src="${path}" alt="49 pixel preview"></div>`:''}`;section.querySelector('.grid').append(a)}document.querySelector('#assets').append(section)}
fetch('../../verification/gelato-garden-v1/gallery-screens.json').then(r=>r.ok?r.json():[]).then(images=>{if(!images.length)return;document.querySelector('#screens').innerHTML='<h2>In the game</h2><div class="grid screens"></div>';for(const item of images){const a=document.createElement('a');a.className='card';a.href=item.path;a.target='_blank';a.innerHTML=`<img src="${item.path}" alt="${item.title}"><span>${item.title}</span>`;document.querySelector('#screens .grid').append(a)}}).catch(()=>{});
</script></html>
