 <linearGradient id="apron" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8df"/><stop offset=".55" stop-color="#f1e4c7"/><stop offset="1" stop-color="#d9c6a6"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#f9c194"/><stop offset=".48" stop-color="#edaa7e"/><stop offset="1" stop-color="#d98d68"/></linearGradient>
