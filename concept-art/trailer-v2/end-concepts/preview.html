<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sugarfall — ending compositions</title>
<style>
@font-face{font-family:SugarfallFraunces;src:url('../../../PLINKO/data/fonts/Fraunces-Variable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:block}
*{box-sizing:border-box}body{margin:0;padding:28px;background:#f6f2e8;color:#3d5244;font-family:Segoe UI,Arial,sans-serif}h1{font:650 34px SugarfallFraunces,serif;font-variation-settings:'wght' 650,'SOFT' 70,'opsz' 36,'WONK' 1;margin:0 0 10px}p{margin:0 0 22px;line-height:1.5}.grid{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}.option{width:500px;margin:0}.frame{width:500px;height:888.889px;position:relative;overflow:hidden;border-radius:10px;background:#c9ded0}.canvas{position:relative;width:1080px;height:1920px;overflow:hidden;transform:scale(.462962963);transform-origin:0 0;background:#c9ded0}.canvas img{position:absolute;display:block}.wordmark{position:absolute;z-index:8;width:100%;left:0;text-align:center;color:#5c3c2b;font-family:SugarfallFraunces,serif;font-size:168px;font-weight:650;font-variation-settings:'wght' 650,'SOFT' 70,'opsz' 36,'WONK' 1;letter-spacing:-5px;line-height:1.15;text-shadow:0 3px 0 #fff8e6;white-space:nowrap}figcaption{margin-top:13px;font-weight:600}figcaption span{display:block;font-weight:400;margin-top:5px;line-height:1.45;color:#66766c}.texture{width:1080px;height:1920px;object-fit:cover;left:0;top:0}.warm-wash{position:absolute;inset:0;background:linear-gradient(180deg,#fff5d847 0%,#fbf9e416 46%,#94b9a744 100%)}.a .wordmark{top:465px}.a .cup{width:670px;height:670px;object-fit:contain;left:205px;top:1125px;filter:drop-shadow(0 25px 25px #46624d25)}.a .donut{width:265px;height:265px;object-fit:contain;left:430px;top:1080px;transform:rotate(-18deg);z-index:5;filter:drop-shadow(-7px 12px 12px #51422a15)}.a .rim{position:absolute;left:126px;right:126px;bottom:137px;border-top:1px solid #7c9c7b55}.a .glow{position:absolute;left:90px;top:930px;width:900px;height:650px;border-radius:50%;background:radial-gradient(ellipse,#fff7d888 0%,#fff8d800 72%)}.a .peg-left{width:128px;height:128px;left:154px;top:921px;transform:rotate(-12deg);opacity:.55}.a .peg-right{width:112px;height:112px;right:118px;top:840px;transform:rotate(15deg);opacity:.4}
.b .texture{filter:saturate(.85) brightness(1.06)}.b .wordmark{top:485px}.b .tray-wrap{position:absolute;left:90px;top:1060px;width:900px;height:620px;transform:rotate(-4deg);z-index:3}.b .serving-tray{width:620px;height:900px;object-fit:contain;left:140px;top:-140px;transform:rotate(90deg);filter:drop-shadow(10px 20px 19px #4d735b30)}.b .donut{width:290px;height:290px;left:165px;top:1170px;z-index:6;transform:rotate(-20deg);filter:drop-shadow(0 13px 9px #4c5c3d20)}.b .gelato{width:225px;height:225px;left:447px;top:1176px;z-index:6;filter:drop-shadow(0 13px 9px #4c5c3d20)}.b .candy{position:absolute;width:230px;height:233px;left:696px;top:1137px;z-index:6;overflow:hidden;transform:rotate(14deg);filter:drop-shadow(0 13px 9px #4c5c3d20)}.b .candy img{width:934.603px;height:623.069px;left:-48.68px;top:-44.42px}.b .peg-left{width:100px;height:100px;left:114px;top:944px;transform:rotate(-16deg);opacity:.48}.b .peg-right{width:130px;height:130px;left:840px;top:907px;transform:rotate(12deg);opacity:.35}.b .tray-shadow{position:absolute;left:175px;top:1515px;width:740px;height:130px;border-radius:50%;background:#6c917e20;filter:blur(22px)}
.render{padding:0;background:transparent}.render header,.render figcaption{display:none}.render .grid{display:block}.render .option{display:none;width:1080px}.render .frame{width:1080px;height:1920px;border-radius:0}.render .canvas{transform:none}.render[data-concept="catch"] .option-a,.render[data-concept="tray"] .option-b{display:block}
@media(max-width:1080px){.grid{gap:26px}.option{width:min(500px,100%)}.frame{max-width:100%}}
</style>
</head>
<body>
<header><h1>Two ways to finish the trailer</h1><p>Composition studies using the game’s bundled Fraunces face and painted food assets. No returning Mabel, text prompts or darkened-board overlay.</p></header>
<div class="grid">
<figure class="option option-a"><div class="frame"><div class="canvas a" role="img" aria-label="Sugarfall title above a pink doughnut landing toward the painted golden collection cup on a mint bakery surface">
<img class="texture" src="../../../PLINKO/data/art/food/countertop.png" alt="">
<div class="warm-wash"></div><div class="glow"></div>
<div class="wordmark">Sugarfall</div>
<img class="cup" src="../../../PLINKO/data/art/food/cup_gold.png" alt="">
<img class="donut" src="../../../PLINKO/data/art/food/donut.png" alt="">
<div class="rim"></div>
</div></div><figcaption>A · The last catch<span>Match the final real cup catch into this closer composition. The doughnut settles, then the title holds for the musical tail.</span></figcaption></figure>
<figure class="option option-b"><div class="frame"><div class="canvas b" role="img" aria-label="Sugarfall title above a ceramic serving tray containing a pink doughnut, strawberry gelato and aqua candy">
<img class="texture" src="../../../PLINKO/data/art/food/countertop.png" alt="">
<div class="warm-wash"></div><div class="tray-shadow"></div>
<div class="wordmark">Sugarfall</div>
<div class="tray-wrap"><img class="serving-tray" src="../../../PLINKO/data/art/food/tray.png" alt=""></div>
<img class="donut" src="../../../PLINKO/data/art/food/donut.png" alt="">
<img class="gelato" src="../../../PLINKO/data/art/gelato/food/donut.png" alt="">
<div class="candy"><img src="../../../PLINKO/data/art/crystal/food/balls_atlas.png" alt=""></div>
</div></div><figcaption>B · The finished tray<span>A brief serving-tray finish gathers the game’s treats below the title. The tray arrives and stops; the brand stays still.</span></figcaption></figure>
</div>
<script>
const concept=new URLSearchParams(location.search).get('concept');
if(concept){document.body.classList.add('render');document.body.dataset.concept=concept;}
window.fontReady=document.fonts.load('650 168px SugarfallFraunces').then(faces=>({faces:faces.length,loaded:document.fonts.check('650 168px SugarfallFraunces')}));
</script>
</body>
</html>
