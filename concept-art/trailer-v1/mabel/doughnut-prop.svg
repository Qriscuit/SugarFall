 <linearGradient id="hairLight" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#be7a44"/><stop offset=".42" stop-color="#8b4b29"/><stop offset="1" stop-color="#61341f"/></linearGradient>
 <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6b473"/><stop offset=".35" stop-color="#c98646"/><stop offset=".7" stop-color="#a46337"/><stop offset="1" stop-color="#79482c"/></linearGradient>
 <linearGradient id="shoe" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#986b47"/><stop offset="1" stop-color="#50392c"/></linearGradient>
 <radialGradient id="iris"><stop stop-color="#b57837"/><stop offset=".6" stop-color="#805024"/><stop offset="1" stop-color="#4a3020"/></radialGradient>
 <linearGradient id="dough" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eeb77a"/><stop offset=".5" stop-color="#d99148"/><stop offset="1" stop-color="#b76a30"/></linearGradient>
 <linearGradient id="icing" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffb4bb"/><stop offset=".55" stop-color="#f0869b"/><stop offset="1" stop-color="#d86984"/></linearGradient>
 <filter id="paper" x="-18%" y="-12%" width="136%" height="130%" color-interpolation-filters="sRGB">
  <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="edge"/>
  <feFlood flood-color="#fff7df" result="ivory"/>
  <feComposite in="ivory" in2="edge" operator="in" result="cutEdge"/>
  <feGaussianBlur in="edge" stdDeviation="3.4" result="blur"/>
  <feOffset in="blur" dx="4" dy="7" result="offset"/>
  <feFlood flood-color="#3f3026" flood-opacity=".25" result="shadowColor"/>
  <feComposite in="shadowColor" in2="offset" operator="in" result="shadow"/>
  <feMerge><feMergeNode in="shadow"/><feMergeNode in="cutEdge"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
